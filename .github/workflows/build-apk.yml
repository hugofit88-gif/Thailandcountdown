name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the Android project
        run: unzip -q "ThailandCountdown-Android-Project (3).zip" -d "$RUNNER_TEMP/android-project"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/android-project" :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ThailandCountdown-debug
          path: ${{ runner.temp }}/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
